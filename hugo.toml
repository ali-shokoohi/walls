baseURL = 'https://walls.shokoohi.dev/'
title = 'Small Bot, Strong Walls'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']

[languages.en]
  weight = 1
  label = 'English'
  locale = 'en-US'
  direction = 'ltr'
  title = 'Small Bot, Strong Walls'
  [languages.en.params]
    description = 'Learn AI bot security through 14 forgiving story missions. No coding, timers, or server experience required.'

[languages.fa]
  weight = 2
  label = 'فارسی'
  locale = 'fa-IR'
  direction = 'rtl'
  title = 'ربات کوچک، دیوارهای محکم'
  [languages.fa.params]
    description = 'امنیت ربات هوش مصنوعی را با ۱۴ مأموریت داستانی یاد بگیر؛ بدون نیاز به کدنویسی، زمان‌سنج یا تجربهٔ مدیریت سرور.'

[languages.es]
  weight = 3
  label = 'Español'
  locale = 'es-ES'
  direction = 'ltr'
  title = 'Bot pequeño, muros fuertes'
  [languages.es.params]
    description = 'Aprende a proteger un bot de IA con 14 misiones narrativas. Sin programar, sin cronómetros y sin experiencia con servidores.'

[module.hugoVersion]
  min = '0.158.0'
