name: Contributor checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Hugo and verify its checksum
        env:
          HUGO_VERSION: "0.167.0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hugo" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/hugo"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          tar -xzf "$archive" hugo
          install -m 0755 hugo "$HOME/.local/bin/hugo"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build -- --panicOnWarning
